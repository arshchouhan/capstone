<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Plant camera · Plantaexa</title>
<style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#eff6f7;color:#172846;font-family:system-ui,sans-serif}main{max-width:580px;margin:auto;padding:24px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:750;color:#365e7c}.badge{font-size:12px;background:#dcebf5;padding:7px 11px;border-radius:20px}h1{font-size:26px;margin:0 0 10px}p{color:#61819b;line-height:1.6}video,#photo{display:block;width:100%;max-height:60vh;object-fit:contain;background:#dce8ef;border-radius:18px;margin:20px 0}button{font:inherit;font-weight:650;min-height:48px;border:1px solid #b5d2e5;border-radius:12px;padding:12px 18px;background:white;color:#365e7c;cursor:pointer}#start,#take{background:#365e7c;color:white;border-color:#365e7c;width:100%}button:disabled{opacity:.5}nav{display:flex;gap:12px}nav button{flex:1}#status{font-size:14px;padding:12px 0;min-height:44px}#error{color:#b42f46}small{display:block;color:#61819b;line-height:1.6;margin-top:22px}</style></head>
<body><main><header><span class="brand">Plantaexa</span><span class="badge">Local camera</span></header><h1>Take a plant photo</h1><p id="intro">Take a photo on your phone and it will appear on your laptop. Keep both devices on the same Wi-Fi.</p><video id="preview" autoplay muted playsinline hidden></video><img id="photo" alt="Your plant photo" hidden><button id="start" hidden>Start camera</button><button id="take" disabled>Take photo</button><input id="photo-input" type="file" accept="image/*" capture="environment" hidden><nav hidden id="controls"><button id="flip">Switch camera</button><button id="stop">Disconnect</button></nav><div id="status" role="status">Connecting to your laptop…</div><div id="error" role="alert"></div><small>Your photo goes directly to your laptop over your local network.</small></main><script src="/phone-camera.js" defer></script></body></html>
